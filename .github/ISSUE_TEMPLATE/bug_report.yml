name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please fill in as much as you can.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new workbook
        2. Type =SUM(A1:A3) in B1
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: If this is an Excel compatibility issue, describe what Excel does.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tabula version
      placeholder: "0.1.0, or a commit hash"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux (Wayland)
        - Linux (X11)
        - Windows
        - macOS
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, files or logs
      description: Drag in screenshots or a small sample workbook that shows the problem.
